name: Update base-image pins

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-image-pins
  cancel-in-progress: false

jobs:
  update:
    name: Refresh base-image pins
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Refresh tracked base-image digests
        run: |
          set -euo pipefail
          # Resolve every configured base tag independently. Versioned tags can
          # move too, so checking only references named "latest" is insufficient.
          while IFS=$'\t' read -r key field base; do
            image=${base%%@*}
            digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
            case "$digest" in
              sha256:[0-9a-f][0-9a-f]*) ;;
              *) echo "Could not resolve an OCI digest for $image: $digest" >&2; exit 1 ;;
            esac
            jq --arg key "$key" --arg field "$field" --arg image "${image}@${digest}" \
              '.distributions[$key][$field] = $image' images.json > images.json.next
            mv images.json.next images.json
          done < <(jq -r '
            .distributions | to_entries[] |
            [.key, "base", .value.base],
            (if .value.build_base then [.key, "build_base", .value.build_base] else empty end) |
            @tsv
          ' images.json)

          jq -e . images.json >/dev/null

      - name: Create pull request when inputs changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Image inputs are already current."
            exit 0
          fi
          branch="automation/update-image-pins"
          git switch --create "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images.json
          git commit -m "chore: refresh base-image pins"
          # This branch is automation-owned. Force-pushing it refreshes an
          # existing update PR without touching the protected default branch.
          git push --force --set-upstream origin "$branch"
          pr=$(gh pr list --head "$branch" --base master --state open --json number \
            --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create \
              --base master \
              --head "$branch" \
              --title "chore: refresh base-image pins" \
              --body "Updates every configured runtime and builder base-image digest."
            pr=$(gh pr list --head "$branch" --base master --state open --json number \
              --jq '.[0].number')
          fi
          gh pr merge "$pr" --auto --squash --delete-branch
