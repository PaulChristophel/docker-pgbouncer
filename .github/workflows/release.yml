name: Build and publish PgBouncer images

on:
  push:
    branches:
      - master
    paths:
      - "*.dockerfile"
      - "entrypoint.sh"
      - "images.json"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Load build matrix
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.matrix.outputs.image }}
      pgbouncer: ${{ steps.matrix.outputs.pgbouncer }}
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read image configuration
        id: matrix
        run: |
          echo "image=$(jq -r '.image' images.json)" >> "$GITHUB_OUTPUT"
          echo "pgbouncer=$(jq -c '.pgbouncer' images.json)" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c '.variants' images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: PgBouncer ${{ matrix.pgbouncer.version }} ${{ matrix.variant.tag }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        pgbouncer: ${{ fromJSON(needs.prepare.outputs.pgbouncer) }}
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: pcm0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}
            type=raw,value=${{ matrix.pgbouncer.series }}-${{ matrix.variant.tag }}
            type=raw,value=${{ matrix.pgbouncer.version }},enable=${{ matrix.variant.latest && matrix.pgbouncer.channel == 'stable' }}
            type=raw,value=${{ matrix.pgbouncer.series }},enable=${{ matrix.variant.latest && matrix.pgbouncer.channel == 'stable' }}
            type=raw,value=latest,enable=${{ matrix.variant.latest && matrix.pgbouncer.channel == 'stable' }}
            type=sha,prefix=${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}-sha-

      - name: Record build timestamp
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            PGBOUNCER_VERSION=${{ matrix.pgbouncer.version }}
            PGBOUNCER_COMMIT=${{ matrix.pgbouncer.commit }}
            PGBOUNCER_SOURCE_SHA256=${{ matrix.pgbouncer.sha256 }}
            IMAGE_REPOSITORY=${{ env.IMAGE_NAME }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.build-time.outputs.created }}
          cache-from: type=gha,scope=pgbouncer-${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}
          cache-to: type=gha,mode=max,scope=pgbouncer-${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/pcm0/pgbouncer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
