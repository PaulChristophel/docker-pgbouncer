name: Build and publish PgBouncer images

on:
  push:
    branches:
      - master
    paths:
      - "*.dockerfile"
      - "entrypoint.sh"
      - "images.json"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Load build matrix
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.matrix.outputs.image }}
      pgbouncer: ${{ steps.matrix.outputs.pgbouncer }}
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read image configuration
        id: matrix
        run: |
          echo "image=$(jq -r '.image' images.json)" >> "$GITHUB_OUTPUT"
          echo "pgbouncer=$(jq -c '.pgbouncer' images.json)" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c '.distributions as $distributions | [.variants[] | . + {distribution: $distributions[.os].name, distribution_version: $distributions[.os].version, base: $distributions[.os].base, build_base: ($distributions[.os].build_base // $distributions[.os].base)}]' images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: PgBouncer ${{ matrix.pgbouncer.version }} ${{ matrix.variant.tag }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        pgbouncer: ${{ fromJSON(needs.prepare.outputs.pgbouncer) }}
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: pcm0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record build timestamp
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}
            type=raw,value=${{ matrix.pgbouncer.series }}-${{ matrix.variant.tag }}
            type=raw,value=${{ matrix.pgbouncer.version }},enable=${{ matrix.variant.latest && matrix.pgbouncer.channel == 'stable' }}
            type=raw,value=${{ matrix.pgbouncer.series }},enable=${{ matrix.variant.latest && matrix.pgbouncer.channel == 'stable' }}
            type=raw,value=latest,enable=${{ matrix.variant.latest && matrix.pgbouncer.channel == 'stable' }}
            type=sha,prefix=${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}-sha-
          annotations: |
            org.opencontainers.image.title=CloudNativePG PgBouncer ${{ matrix.pgbouncer.version }} (${{ matrix.variant.tag }})
            org.opencontainers.image.description=PgBouncer ${{ matrix.pgbouncer.version }} built from upstream source for CloudNativePG using the ${{ matrix.variant.tag }} variant.
            org.opencontainers.image.authors=Paul Christophel <pmartin@gatech.edu>
            org.opencontainers.image.vendor=Paul Christophel
            org.opencontainers.image.source=https://github.com/PaulChristophel/docker-pgbouncer
            org.opencontainers.image.url=https://hub.docker.com/r/pcm0/pgbouncer
            org.opencontainers.image.documentation=https://github.com/PaulChristophel/docker-pgbouncer#readme
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ matrix.pgbouncer.version }}
            org.opencontainers.image.ref.name=${{ env.IMAGE_NAME }}:${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}
            org.opencontainers.image.component.pgbouncer.version=${{ matrix.pgbouncer.version }}
            org.opencontainers.image.component.pgbouncer.revision=${{ matrix.pgbouncer.commit }}
            org.opencontainers.image.base.name=${{ matrix.variant.base }}
            edu.gatech.image.owner=Paul Christophel <pmartin@gatech.edu>
            edu.gatech.image.repository=${{ env.IMAGE_NAME }}
            edu.gatech.image.os.distribution=${{ matrix.variant.distribution }}
            edu.gatech.image.os.version=${{ matrix.variant.distribution_version }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            BASE=${{ matrix.variant.base }}
            BUILD_BASE=${{ matrix.variant.build_base }}
            PGBOUNCER_VERSION=${{ matrix.pgbouncer.version }}
            PGBOUNCER_COMMIT=${{ matrix.pgbouncer.commit }}
            PGBOUNCER_SOURCE_SHA256=${{ matrix.pgbouncer.sha256 }}
            IMAGE_REPOSITORY=${{ env.IMAGE_NAME }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.build-time.outputs.created }}
            IMAGE_DISTRIBUTION=${{ matrix.variant.distribution }}
            IMAGE_DISTRIBUTION_VERSION=${{ matrix.variant.distribution_version }}
          cache-from: type=gha,scope=pgbouncer-${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}
          cache-to: type=gha,mode=max,scope=pgbouncer-${{ matrix.pgbouncer.version }}-${{ matrix.variant.tag }}

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/pcm0/pgbouncer
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
